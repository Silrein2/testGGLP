log:
  level: INFO

entryPoints:
  web:
    # http
    address: ":80"
    http:
      # https://doc.traefik.io/traefik/routing/entrypoints/#entrypoint
      redirections:
        entryPoint:
          to: web-secure

  web-secure:
    # https
    address: ":443"

  flower:
    address: ":5555"

certificatesResolvers:
  letsencrypt:
    # https://doc.traefik.io/traefik/https/acme/#lets-encrypt
    acme:
      email: "randy@gameka.my"
      storage: /etc/traefik/acme/acme.json
      # https://doc.traefik.io/traefik/https/acme/#httpchallenge
      httpChallenge:
        entryPoint: web

http:
  routers:
    web-unity-router:
      rule: "Host(`beesafe.gamekaexternalprojects.com`) && (Path(`/`) || PathPrefix(`/Build`) || Path(`/favicon.ico`) || Path(`/style.css`) || Path(`/Web.loader.js`) || Path(`/detector.js`))"
      entryPoints:
        - web-secure
      service: unity
      priority: 100
      tls:
        certResolver: letsencrypt

    web-django-router:
      rule: "Host(`beesafe.gamekaexternalprojects.com`) && (PathPrefix(`/api`) || PathPrefix(`/admin`) || PathPrefix(`/site`) || PathPrefix(`/media`) || PathPrefix(`/static`) || PathPrefix(`/auth`))"
      entryPoints:
        - web-secure
      middlewares:
        - csrf
      service: django
      priority: 1
      tls:
        certResolver: letsencrypt

    flower-secure-router:
      rule: "Host(`beesafe.gamekaexternalprojects.com`)"
      entryPoints:
        - flower
      service: flower
      tls:
        # https://doc.traefik.io/traefik/master/routing/routers/#certresolver
        certResolver: letsencrypt

  middlewares:
    csrf:
      headers:
        hostsProxyHeaders: ["X-CSRFToken"]

  services:
    django:
      loadBalancer:
        servers:
          - url: http://django:5000

    flower:
      loadBalancer:
        servers:
          - url: http://flower:5555

    unity:
      loadBalancer:
        servers:
          - url: http://bee_safe_unity:80

providers:
  # https://doc.traefik.io/traefik/master/providers/file/
  file:
    filename: /etc/traefik/traefik.yml
    watch: true

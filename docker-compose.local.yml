volumes:
  bee_safe_local_postgres_data: {}
  bee_safe_local_postgres_data_backups: {}
  bee_safe_local_redis_data: {}

services:
  django: &django
    build:
      context: .
      dockerfile: ./compose/local/django/Dockerfile
    image: bee_safe_local_django
    container_name: bee_safe_local_django
    depends_on:
      - postgres
      - mailpit
    volumes:
      - .:/app:z
    env_file:
      - ./.envs/.local/.django
      - ./.envs/.local/.postgres
    ports:
      - "8000:8000"
    command: /start

  postgres:
    build:
      context: .
      dockerfile: ./compose/production/postgres/Dockerfile
    image: bee_safe_production_postgres
    container_name: bee_safe_local_postgres
    volumes:
      - bee_safe_local_postgres_data:/var/lib/postgresql/data
      - bee_safe_local_postgres_data_backups:/backups
    env_file:
      - ./.envs/.local/.postgres
    command: postgres -c max_connections=1000 -c shared_buffers=512MB -c work_mem=16MB -c effective_cache_size=2GB

  pgbouncer:
    image: edoburu/pgbouncer
    container_name: pgbouncer
    ports:
      - "6432:6432"
    env_file:
      - ./.envs/.staging/.postgres
    depends_on:
      - postgres

  mailpit:
    image: docker.io/axllent/mailpit:latest
    container_name: bee_safe_local_mailpit
    ports:
      - "8025:8025"

  redis:
    image: docker.io/redis:6
    container_name: bee_safe_local_redis
    volumes:
      - bee_safe_local_redis_data:/data

  celeryworker:
    <<: *django
    image: bee_safe_local_celeryworker
    container_name: bee_safe_local_celeryworker
    depends_on:
      - redis
      - postgres
      - mailpit
    ports: []
    command: /start-celeryworker

  celerybeat:
    <<: *django
    image: bee_safe_local_celerybeat
    container_name: bee_safe_local_celerybeat
    depends_on:
      - redis
      - postgres
      - mailpit
    ports: []
    command: /start-celerybeat

  flower:
    <<: *django
    image: bee_safe_local_flower
    container_name: bee_safe_local_flower
    ports:
      - "5555:5555"
    command: /start-flower
